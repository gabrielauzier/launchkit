name: Desktop Release

# Builds the desktop installers and publishes them to the releases repository
# named by the repository variable LAUNCHKIT_DESKTOP_RELEASE_REPO (owner/repo).
# Push a tag such as desktop-v0.1.0; it must match desktop/package.json.
on:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: read

jobs:
  desktop-release:
    name: Desktop Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Check the tag matches the desktop version
        shell: bash
        working-directory: desktop
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "desktop-v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match desktop/package.json version ${version}"
            exit 1
          fi

      - name: Resolve the releases repository and signing
        shell: bash
        env:
          RELEASE_REPO: ${{ vars.LAUNCHKIT_DESKTOP_RELEASE_REPO }}
          HAS_MAC_CERT: ${{ secrets.CSC_LINK != '' }}
          HAS_WIN_CERT: ${{ secrets.WIN_CSC_LINK != '' }}
        run: |
          if ! [[ "${RELEASE_REPO}" =~ ^[^/]+/[^/]+$ ]]; then
            echo "::error::Set the repository variable LAUNCHKIT_DESKTOP_RELEASE_REPO to owner/repo"
            exit 1
          fi
          echo "LAUNCHKIT_DESKTOP_RELEASE_OWNER=${RELEASE_REPO%%/*}" >> "$GITHUB_ENV"
          echo "LAUNCHKIT_DESKTOP_RELEASE_REPO_NAME=${RELEASE_REPO##*/}" >> "$GITHUB_ENV"
          # Only a code-signed build may auto-update (macOS refuses unsigned
          # updates); Linux packages have no signature to check.
          signed=false
          case "${RUNNER_OS}" in
            macOS) [ "${HAS_MAC_CERT}" = "true" ] && signed=true ;;
            Windows) [ "${HAS_WIN_CERT}" = "true" ] && signed=true ;;
            Linux) signed=true ;;
          esac
          echo "LAUNCHKIT_DESKTOP_SIGNED=${signed}" >> "$GITHUB_ENV"
          if [ "${signed}" = "false" ]; then
            echo "::warning::No signing certificate for ${RUNNER_OS}: this build is unsigned and will not auto-update."
          fi

      - name: Install dependencies
        shell: bash
        run: |
          npm ci --prefix frontend
          npm ci --prefix desktop

      - name: Build the app
        working-directory: desktop
        run: npm run build:all

      - name: Package, sign and publish
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.LAUNCHKIT_DESKTOP_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          # macOS signing and notarization
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows signing
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npx electron-builder --publish always
