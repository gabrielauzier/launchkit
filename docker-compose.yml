name: launchkit

# podman-compose groups all services into a single pod by default, which
# interferes with per-service port mapping and networking. Disabling it makes
# podman-compose behave like Docker Compose. Docker ignores unknown top-level
# x- keys.
x-podman:
  in_pod: false

x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/launchkit
  SECRET_KEY: ${SECRET_KEY:-dev-secret-change-in-production}
  DEBUG: ${DEBUG:-true}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:${FRONTEND_PORT:-3000}}
  WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-launchkit}
  WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-}
  WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:-}
  REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
  OIDC_ENABLED: ${OIDC_ENABLED:-false}
  OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-OIDC}
  OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL:-}
  OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
  OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
  OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
  OIDC_SCOPES: ${OIDC_SCOPES:-openid email profile}
  OIDC_AUTO_REGISTER: ${OIDC_AUTO_REGISTER:-true}
  OIDC_EXISTING_USER_LINK_MODE: ${OIDC_EXISTING_USER_LINK_MODE:-disabled}
  OIDC_REQUIRE_VERIFIED_EMAIL: ${OIDC_REQUIRE_VERIFIED_EMAIL:-true}
  OIDC_SYNC_ROLES: ${OIDC_SYNC_ROLES:-false}
  OIDC_ROLES_CLAIM: ${OIDC_ROLES_CLAIM:-groups}
  OIDC_ADMIN_ROLES: ${OIDC_ADMIN_ROLES:-}
  OIDC_WORKSPACE_ROLE_MAP: ${OIDC_WORKSPACE_ROLE_MAP:-}
  LOCAL_AUTH_ENABLED: ${LOCAL_AUTH_ENABLED:-true}
  REDIS_URL: redis://redis:6379/0
  STORAGE_LOCAL_PATH: /app/data/files
  STORAGE_MAX_FILE_SIZE_MB: ${STORAGE_MAX_FILE_SIZE_MB:-10}
  STORAGE_ALLOWED_EXTENSIONS: ${STORAGE_ALLOWED_EXTENSIONS:-jpg,jpeg,png,webp,gif,heic,pdf}
  UPDATE_CHECK_REPO: ${UPDATE_CHECK_REPO:-}

x-backend-base: &backend-base
  build: ./backend
  environment: *backend-env
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }
  volumes:
    - ./backend:/app
    - files:/app/data/files
  restart: unless-stopped

services:
  redis:
    image: docker.io/library/redis:8-alpine
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  db:
    image: ${DB_IMAGE:-docker.io/library/postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: launchkit
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    <<: *backend-base
    command:
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port
      8000 --reload"
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "${FRONTEND_PORT:-3000}:5173"
    environment:
      BACKEND_URL: http://backend:8000
      # Also drives Vite's allowedHosts, so a proxied domain is not blocked.
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:${FRONTEND_PORT:-3000}}
      APP_VERSION_ROOT: /workspace
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - ./:/workspace:ro
      - /app/node_modules
    restart: unless-stopped

  celery-worker:
    <<: *backend-base
    # Limit to 2 workers to save RAM (default = number of CPUs).
    command: celery -A app.worker worker --loglevel=info --concurrency=2

  celery-beat:
    <<: *backend-base
    command: celery -A app.worker beat --loglevel=info

volumes:
  pgdata:
  files:
